az:{eyebrow:"İNTERAKTİV DETEKTİV DOSYESİ · 001",intro:"Muzeyin arxivində bir nəfər ölü tapılıb. Otaq bağlı idi. Dörd nəfərin ifadəsi var. Hər kəs nəyisə gizlədir — amma yalnız biri qatil ola bilər.",brief:"HADİSƏ: 22:15–23:40 · MƏKAN: Şəhər Tarixi Muzeyi · Vəzifən: cinayətkarı, üsulu və motivi sübutlarla müəyyən et.",tab0:"İŞİN TƏSVİRİ",tab1:"SÜBUTLAR",tab2:"ŞÜBHƏLİLƏR",tab3:"ZAMAN XƏTTİ",tab4:"NƏTİCƏ",sceneTag:"HADİSƏ YERİ",sceneTitle:"Arxiv otağında son gecə",scene:"Muzeyin baş kuratoru Kamran Səlimli saat 23:40-da arxiv otağında ölü tapılır. Qapı elektron kartla açılır, pəncərələr daxildən bağlıdır. İlkin ölüm vaxtı 22:50–23:20 arasıdır. Zorla giriş izi yoxdur. Masada yarımçıq çay, cırılmış sərgi müqaviləsi və dayanmış masa saatı var.",instruction:"Tələsmə. Bütün sübutları, ifadələri və zaman xəttini araşdır. Sonra kimin, necə və niyə etdiyini seç. Düzgün cavabdan sonra həqiqət açılacaq.",clueNames:["Elektron giriş jurnalı","Çay fincanı","Cırılmış müqavilə","Masa saatı","Mühafizəçinin səs qeydi","Elektrik paneli"],clues:["22:00-dan sonra arxivə yalnız iki kartla giriş qeydə alınıb: kuratorun kartı və direktorun ehtiyat kartı. 22:46-da qapının daxildən açıldığı görünür.","Fincanın kənarında yalnız kuratorun barmaq izləri var. Çayda zəhər və ya sakitləşdirici aşkarlanmayıb.","Müqavilədə muzeyə məxsus eksponatın şəxsi kolleksiyaya verilməsi bəndi var. İmza səhifəsi yoxa çıxıb.","Saat 23:17-də dayanıb. Mexanizm zərbədən deyil, batareyanın çıxarılmasından dayanıb.","Mühafizəçi 22:58-də metal səs eşitdiyini deyir. Yazıda həmin anda saat zəngi də eşidilir.","Kamera 22:30–23:05 arası sönüb. Kəsinti arxiv otağında deyil, elektrik panelinin yerləşdiyi dəhlizdə başlayıb."],suspects:["Leyla Səlimli","Orxan Məmmədov","Nərmin Qasımova","Rauf Əliyev"],roles:["Kuratorun qızı","Muzey direktoru","Restavrator","Gecə mühafizəçisi"],statements:["Atamla 21:50-də danışdım, sonra evə getdim. Müqaviləni ləğv edəcəyini demişdi.","22:20-də binadan çıxdım. Ehtiyat kart seyfdə saxlanılır. Heç kimə verməmişəm.","22:40-da restavrasiya otağında idim. Kameranın kəsildiyini bilmirdim.","22:58-də səs eşitdim, amma qapını açmadım. Protokola görə əvvəlcə direktorla əlaqə saxlamalı idim."],details:["Atasının şəxsi kolleksiyanı muzeydən çıxarmaq qərarı ailə mübahisəsi yaratmışdı.","Müqavilənin imzalanması onun vəzifəsini və nüfuzunu riskə atırdı.","Bərpa edilən eksponatın saxta nüsxə ilə əvəzlənməsi araşdırılırdı.","Həmin gecə elektrik panelinə çıxışı olan yeganə əməkdaş idi."],timeline:["21:50 — Leyla atasının otağından çıxır.","22:20 — Orxan binanı tərk etdiyini bildirir.","22:30 — Dəhliz kamerası sönür.","22:40 — Nərmin restavrasiya otağında olduğunu deyir.","22:46 — Arxiv qapısı daxildən açılır.","22:58 — Rauf metal səs eşidir.","23:17 — Masa saatı dayanır.","23:40 — Cəsəd tapılır."],verdictTag:"MÜSTƏNTİQİN YEKUN HESABATI",verdictTitle:"Sənin nəzəriyyən nədir?",verdictIntro:"Cinayətkarı, üsulu və motivi seç. Həll cavabını təqdim etdikdən sonra açılacaq.",suspectLabel:"ŞÜBHƏLİ",methodLabel:"CİNAYƏT ÜSULU",motiveLabel:"MOTİV",people:["Leyla","Orxan","Nərmin","Rauf"],methods:["Elektrik panelindən kameranı söndürüb gizli giriş","Zəhərli çay","Əvvəlcədən qurulmuş mexaniki tələ","Birbaşa fiziki hücum"],motives:["Miras və ailə mübahisəsi","Saxta eksponat və müqavilə qalmaqalını ört-basdır etmək","Şəxsi qisas","Pul oğurluğu"],correct:["Rauf","Elektrik panelindən kameranı söndürüb gizli giriş","Saxta eksponat və müqavilə qalmaqalını ört-basdır etmək"],submit:"NƏZƏRİYYƏNİ TƏQDİM ET",right:"DÜZGÜN NƏTİCƏ. Sən cinayətkarı, üsulu və motivi birləşdirdin.",wrong:"Bu nəzəriyyə bütün sübutlara uyğun gəlmir. İpuclarını yenidən araşdır.",revealTitle:"HƏQİQƏT: MÜHAFİZƏÇİNİN SON NÖVBƏSİ",reveal:"Qatil Raufdur. O, elektrik panelindəki kəsintidən istifadə edərək dəhliz kamerasını söndürüb arxivə daxil olub. Kurator saxta eksponatın dəyişdirildiyini aşkar etmiş və səhər rəhbərliyə xəbər verməyə hazırlaşmışdı. Rauf bu oğurluq sxeminin üzə çıxacağından qorxurdu. Mübahisə zamanı kuratoru öldürüb, sonra saatın batareyasını çıxararaq 23:17-də dayanmış görüntüsü yaradıb. Həlledici ipucu Raufun 22:58-də eşitdiyini dediyi metal səsidir: səs yazısında həmin anda saat zəngi eşidilir. O, bu detalı bilməməli idi. Deməli, hadisə yerində olub. Çay və müqavilə diqqəti yayındırır; onu ələ verən öz ifadəsidir."},
tr:{eyebrow:"ETKİLEŞİMLİ DEDEKTİF DOSYASI · 001",intro:"Müzenin arşivinde bir adam ölü bulundu. Oda kilitliydi. Dört kişinin ifadesi var. Herkes bir şey saklıyor — ama katil yalnızca biri.",brief:"OLAY: 22:15–23:40 · YER: Şehir Tarihi Müzesi · Görevin: faili, yöntemi ve nedeni kanıtlarla belirlemek.",tab0:"VAKA",tab1:"KANITLAR",tab2:"ŞÜPHELİLER",tab3:"ZAMAN ÇİZELGESİ",tab4:"SONUÇ",sceneTag:"OLAY YERİ",sceneTitle:"Arşiv odasındaki son gece",scene:"Müzenin baş küratörü Kamran Selimli saat 23:40'ta arşiv odasında ölü bulunur. Kapı elektronik kartla açılır, pencereler içeriden kilitlidir. Tahmini ölüm saati 22:50–23:20 arasıdır. Zorla giriş izi yoktur. Masada yarım kalmış çay, yırtılmış sergi sözleşmesi ve durmuş masa saati vardır.",instruction:"Acele etme. Kanıtları, ifadeleri ve zaman çizelgesini incele. Sonra kimin, nasıl ve neden yaptığını seç. Doğru yanıtla gerçek açılacak.",clueNames:["Elektronik giriş kaydı","Çay fincanı","Yırtılmış sözleşme","Masa saati","Güvenlik görevlisinin ses kaydı","Elektrik panosu"],clues:["22:00'den sonra arşive yalnızca iki kartla giriş kaydedilmiş: küratörün kartı ve müdürün yedek kartı. 22:46'da kapının içeriden açıldığı görülüyor.","Fincanın kenarında yalnızca küratörün parmak izleri var. Çayda zehir veya sakinleştirici bulunmadı.","Sözleşmede müzeye ait eserin özel koleksiyona devri maddesi var. İmza sayfası kayıp.","Saat 23:17'de durmuş. Darbe almamış; pili çıkarılmış.","Güvenlik görevlisi 22:58'de metal bir ses duyduğunu söylüyor. Kayıtta aynı anda saat çanı da duyuluyor.","Kamera 22:30–23:05 arasında kapanmış. Kesinti arşiv odasında değil, elektrik panosunun bulunduğu koridorda başlamış."],suspects:["Leyla Selimli","Orhan Mammadov","Nermin Gasımova","Rauf Aliyev"],roles:["Küratörün kızı","Müze müdürü","Restoratör","Gece güvenlik görevlisi"],statements:["Babamla 21:50'de konuştum, sonra eve gittim. Sözleşmeyi iptal edeceğini söylemişti.","22:20'de binadan çıktım. Yedek kart kasada tutulur. Kimseye vermedim.","22:40'ta restorasyon odasındaydım. Kameranın kesildiğini bilmiyordum.","22:58'de ses duydum ama kapıyı açmadım. Protokol gereği önce müdürle görüşmeliydim."],details:["Babasının özel koleksiyonu müzeden çıkarma kararı aile içinde anlaşmazlık yaratmıştı.","Sözleşmenin imzalanması görevini ve itibarını riske atıyordu.","Restore edilen eserin sahtesiyle değiştirildiği araştırılıyordu.","O gece elektrik panosuna erişimi olan tek çalışandı."],timeline:["21:50 — Leyla babasının odasından çıkar.","22:20 — Orhan binadan ayrıldığını söyler.","22:30 — Koridor kamerası kapanır.","22:40 — Nermin restorasyon odasında olduğunu söyler.","22:46 — Arşiv kapısı içeriden açılır.","22:58 — Rauf metal ses duyar.","23:17 — Masa saati durur.","23:40 — Ceset bulunur."],verdictTag:"SON SORUŞTURMA RAPORU",verdictTitle:"Teorin ne?",verdictIntro:"Faili, yöntemi ve nedeni seç. Yanıtını gönderdikten sonra çözüm açılacak.",suspectLabel:"ŞÜPHELİ",methodLabel:"YÖNTEM",motiveLabel:"MOTİV",people:["Leyla","Orhan","Nermin","Rauf"],methods:["Elektrik panosundan kamerayı kapatıp gizli giriş","Zehirli çay","Önceden kurulmuş mekanik tuzak","Doğrudan fiziksel saldırı"],motives:["Miras ve aile anlaşmazlığı","Sahte eser ve sözleşme skandalını örtbas etmek","Kişisel intikam","Para hırsızlığı"],correct:["Rauf","Elektrik panosundan kamerayı kapatıp gizli giriş","Sahte eser ve sözleşme skandalını örtbas etmek"],submit:"TEORİNİ GÖNDER",right:"DOĞRU. Faili, yöntemi ve nedeni birbirine bağladın.",wrong:"Bu teori tüm kanıtlarla örtüşmüyor. İpuçlarını yeniden incele.",revealTitle:"GERÇEK: GÜVENLİK GÖREVLİSİNİN SON VARDİYASI",reveal:"Katil Rauf'tur. Elektrik panosundaki kesintiyi kullanarak koridor kamerasını kapatmış ve arşive girmiştir. Küratör sahte eserin değiştirildiğini fark etmiş, sabah yönetime bildirmeye hazırlanmıştır. Rauf bu hırsızlık düzeninin ortaya çıkmasından korkmuştur. Tartışma sırasında küratörü öldürmüş, ardından saati 23:17'de durmuş gibi göstermek için pilini çıkarmıştır. Belirleyici ipucu Rauf'un 22:58'de duyduğunu söylediği metal sestir: ses kaydında aynı anda saat çanı duyulur. Bu ayrıntıyı bilmemeliydi. Demek ki olay yerindeydi. Çay ve sözleşme dikkat dağıtır; onu ele veren kendi ifadesidir."},
en:{eyebrow:"INTERACTIVE DETECTIVE FILE · 001",intro:"A man is found dead in the museum archive. The room was locked. Four statements. Everyone is hiding something — but only one person is the killer.",brief:"INCIDENT: 22:15–23:40 · LOCATION: City History Museum · Your task: identify the culprit, method and motive through evidence.",tab0:"CASE FILE",tab1:"EVIDENCE",tab2:"SUSPECTS",tab3:"TIMELINE",tab4:"VERDICT",sceneTag:"CRIME SCENE",sceneTitle:"The last night in the archive",scene:"Chief curator Kamran Salimli is found dead in the archive at 23:40. The door uses an electronic access card; windows are locked from inside. Estimated time of death: 22:50–23:20. No forced entry. On the desk: unfinished tea, a torn exhibition contract and a stopped clock.",instruction:"Do not rush. Examine the clues, statements and timeline. Then decide who did it, how and why. The full solution unlocks after your submission.",clueNames:["Electronic access log","Tea cup","Torn contract","Desk clock","Guard's audio recording","Electrical panel"],clues:["After 22:00, only two cards are logged for archive access: the curator's and the director's backup card. At 22:46, the door is recorded opening from inside.","Only the curator's fingerprints are on the rim. No poison or sedative is found in the tea.","The contract contains a clause transferring a museum-owned artefact to a private collection. The signature page is missing.","The clock stopped at 23:17. It was not struck; its battery was removed.","The guard says he heard a metallic sound at 22:58. The recording also captures the clock chime at that exact moment.","The camera was offline from 22:30–23:05. The outage began in the corridor containing the electrical panel, not in the archive."],suspects:["Leyla Salimli","Orkhan Mammadov","Nermin Gasimova","Rauf Aliyev"],roles:["Curator's daughter","Museum director","Restorer","Night security guard"],statements:["I spoke to my father at 21:50, then went home. He said he would cancel the contract.","I left at 22:20. The backup card is kept in the safe. I never gave it to anyone.","I was in the restoration room at 22:40. I did not know the camera was offline.","I heard a sound at 22:58 but did not open the door. Protocol required me to contact the director first."],details:["Her father's plan to remove a private collection from the museum caused a family dispute.","Signing the contract put his position and reputation at risk.","An inquiry was underway into a restored artefact being replaced with a fake.","He was the only employee with access to the electrical panel that night."],timeline:["21:50 — Leyla leaves her father's office.","22:20 — Orkhan says he leaves the building.","22:30 — Corridor camera goes offline.","22:40 — Nermin says she is in the restoration room.","22:46 — Archive door opens from inside.","22:58 — Rauf hears a metallic sound.","23:17 — Desk clock stops.","23:40 — Body discovered."],verdictTag:"FINAL INVESTIGATIVE REPORT",verdictTitle:"What is your theory?",verdictIntro:"Choose the culprit, method and motive. The solution unlocks after you submit.",suspectLabel:"SUSPECT",methodLabel:"METHOD",motiveLabel:"MOTIVE",people:["Leyla","Orkhan","Nermin","Rauf"],methods:["Disable corridor camera at the electrical panel and use concealed access","Poisoned tea","A pre-set mechanical trap","Direct physical assault"],motives:["Inheritance and family dispute","Cover up the fake artefact and contract scandal","Personal revenge","Theft for money"],correct:["Rauf","Disable corridor camera at the electrical panel and use concealed access","Cover up the fake artefact and contract scandal"],submit:"SUBMIT YOUR THEORY",right:"CORRECT. You connected the culprit, method and motive.",wrong:"Your theory does not fit all the evidence. Re-examine the clues.",revealTitle:"THE TRUTH: THE GUARD'S LAST SHIFT",reveal:"Rauf is the killer. He used the electrical outage to disable the corridor camera and enter the archive. The curator had discovered that a genuine artefact was being replaced with a fake and planned to report it in the morning. Rauf feared the theft scheme would be exposed. During a confrontation he killed the curator, then removed the clock battery to make it appear to have stopped at 23:17. The decisive clue is the metallic sound Rauf claims to have heard at 22:58: the recording captures the clock chime at that exact moment. He could not know that detail unless he was inside. The tea and contract distract from the key evidence: his own statement."},
ru:{eyebrow:"ИНТЕРАКТИВНОЕ ДЕТЕКТИВНОЕ ДОСЬЕ · 001",intro:"В архиве музея найден мёртвый человек. Комната была заперта. Есть показания четырёх человек. Каждый что-то скрывает — но убийца только один.",brief:"ПРОИСШЕСТВИЕ: 22:15–23:40 · МЕСТО: Городской исторический музей · Ваша задача — установить виновного, способ и мотив по уликам.",tab0:"ДЕЛО",tab1:"УЛИКИ",tab2:"ПОДОЗРЕВАЕМЫЕ",tab3:"ХРОНОЛОГИЯ",tab4:"ВЕРДИКТ",sceneTag:"МЕСТО ПРЕСТУПЛЕНИЯ",sceneTitle:"Последняя ночь в архиве",scene:"Главного куратора Камрана Салимли находят мёртвым в архиве в 23:40. Дверь открывается электронной картой, окна заперты изнутри. Предполагаемое время смерти: 22:50–23:20. Следов взлома нет. На столе — недопитый чай, разорванный договор выставки и остановившиеся часы.",instruction:"Не торопитесь. Изучите улики, показания и хронологию. Затем решите, кто, как и зачем совершил преступление. Разгадка откроется после ответа.",clueNames:["Журнал электронного доступа","Чашка чая","Разорванный договор","Настольные часы","Аудиозапись охранника","Электрощит"],clues:["После 22:00 вход в архив зарегистрирован только по двум картам: куратора и запасной карте директора. В 22:46 система фиксирует открытие двери изнутри.","На краю чашки только отпечатки куратора. Яда и успокоительного в чае нет.","В договоре есть пункт о передаче музейного экспоната в частную коллекцию. Страница с подписями пропала.","Часы остановились в 23:17. Их не ударили — батарейку вынули.","Охранник говорит, что в 22:58 услышал металлический звук. На записи в тот же момент слышен бой часов.","Камера не работала с 22:30 до 23:05. Сбой начался в коридоре с электрощитом, а не в архиве."],suspects:["Лейла Салимли","Орхан Мамедов","Нермин Гасымова","Рауф Алиев"],roles:["Дочь куратора","Директор музея","Реставратор","Ночной охранник"],statements:["Я говорила с отцом в 21:50, затем ушла домой. Он сказал, что отменит договор.","Я ушёл в 22:20. Запасная карта хранится в сейфе. Я никому её не давал.","В 22:40 я была в реставрационной комнате. Я не знала, что камера отключилась.","В 22:58 я услышал звук, но не открыл дверь. По протоколу сначала следовало связаться с директором."],details:["Решение отца вывести частную коллекцию из музея вызвало семейный конфликт.","Подписание договора угрожало его должности и репутации.","Проверялось, не заменили ли подлинный экспонат подделкой.","В ту ночь только у него был доступ к электрощиту."],timeline:["21:50 — Лейла выходит из кабинета отца.","22:20 — Орхан утверждает, что покидает здание.","22:30 — Камера коридора отключается.","22:40 — Нермин говорит, что находится в реставрационной комнате.","22:46 — Архивная дверь открывается изнутри.","22:58 — Рауф слышит металлический звук.","23:17 — Часы останавливаются.","23:40 — Обнаружено тело."],verdictTag:"ИТОГОВЫЙ ОТЧЁТ СЛЕДОВАТЕЛЯ",verdictTitle:"Какова ваша версия?",verdictIntro:"Выберите виновного, способ и мотив. Разгадка откроется после ответа.",suspectLabel:"ПОДОЗРЕВАЕМЫЙ",methodLabel:"СПОСОБ",motiveLabel:"МОТИВ",people:["Лейла","Орхан","Нермин","Рауф"],methods:["Отключить камеру у электрощита и воспользоваться скрытым доступом","Отравленный чай","Заранее установленная механическая ловушка","Прямое физическое нападение"],motives:["Наследство и семейный конфликт","Скрыть подмену экспоната и скандал с договором","Личная месть","Кража ради денег"],correct:["Рауф","Отключить камеру у электрощита и воспользоваться скрытым доступом","Скрыть подмену экспоната и скандал с договором"],submit:"ПРЕДСТАВИТЬ ВЕРСИЮ",right:"ВЕРНО. Вы связали виновного, способ и мотив.",wrong:"Ваша версия не объясняет все улики. Изучите материалы ещё раз.",revealTitle:"ПРАВДА: ПОСЛЕДНЯЯ СМЕНА ОХРАННИКА",reveal:"Убийца — Рауф. Он воспользовался отключением электрощита, выключил камеру коридора и проник в архив. Куратор обнаружил замену подлинного экспоната подделкой и собирался утром сообщить об этом руководству. Рауф боялся разоблачения схемы хищения. Во время столкновения он убил куратора, затем вынул батарейку часов, чтобы создать видимость остановки в 23:17. Главная улика — металлический звук, который Рауф якобы услышал в 22:58: на записи в тот же момент слышен бой часов. Он не мог знать эту деталь, если не находился внутри. Чай и договор отвлекают от главного доказательства — его собственных слов."}

document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));document.querySelectorAll(".pane").forEach(x=>x.classList.toggle("active",x.id===b.dataset.tab))}));document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;render()}));$("submit").addEventListener("click",()=>{const d=L[lang],ans=[$("who").value,$("how").value,$("why").value];if(ans.some(x=>!x)){alert(lang==="az"?"Üç cavabın hamısını seç.":lang==="tr"?"Üç yanıtı da seç.":lang==="ru"?"Выберите все три ответа.":"Choose all three answers.");return}const box=$("result");box.hidden=false;const ok=ans.every((x,i)=>x===d.correct[i]);box.innerHTML="";const h=document.createElement("h3");h.textContent=ok?d.right:d.wrong;box.append(h);if(ok){const title=document.createElement("h2");title.textContent=d.revealTitle;const p=document.createElement("p");p.textContent=d.reveal;box.append(title,p)}});render();
